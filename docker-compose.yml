version: '3.8'

services:
  streamlit-app:
    build: .
    container_name: kostra_streamlit_workbench
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./localblob:/app/localblob
      - ./models:/app/models
      - ./mlruns:/app/mlruns
    restart: unless-stopped

  fastapi-backend:
    build: .
    container_name: kostra_fastapi_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: uvicorn src.api_server:app --host 0.0.0.0 --port 8000
    volumes:
      - ./data:/app/data
      - ./localblob:/app/localblob
      - ./models:/app/models
      - ./mlruns:/app/mlruns
      - ./index.html:/app/index.html
    restart: unless-stopped

  mlflow-server:
    build: .
    container_name: kostra_mlflow_server
    ports:
      - "5000:5000"
    command: mlflow server --backend-store-uri sqlite:///mlruns/mlflow.db --default-artifact-root ./mlruns --host 0.0.0.0 --port 5000
    volumes:
      - ./mlruns:/app/mlruns
    restart: unless-stopped

