version: '3.8'

services:
  streamlit-app:
    build: .
    container_name: kostra_streamlit_workbench
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./localblob:/app/localblob
      - ./models:/app/models
      - ./mlruns:/app/mlruns
    restart: unless-stopped

  mlflow-server:
    build: .
    container_name: kostra_mlflow_server
    ports:
      - "5000:5000"
    command: mlflow server --backend-store-uri sqlite:///mlruns/mlflow.db --default-artifact-root ./mlruns --host 0.0.0.0 --port 5000
    volumes:
      - ./mlruns:/app/mlruns
    restart: unless-stopped
